name: Release

# Replaces the CircleCI sfcc-release-flow, which was triggered via the
# CircleCI API with pipeline parameters (run_release_workflow, tag).
# In GitHub Actions this is a native manual dispatch with a tag input.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 21.1)"
        required: true
        default: "21.1"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    container:
      image: boltdev/sfcc-ci:v1.1.0
      credentials:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      # The image runs as the circleci user; GHA needs root to write its
      # runner control files under /__w/_temp
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-v2-${{ hashFiles('package-lock.json') }}
      - name: Install Dependencies
        run: npm install --prefer-offline --no-audit
      - name: Link SFRA base cartridge (baked into the sfcc-ci image)
        run: |
          for p in /home/circleci/storefront-reference-architecture /root/storefront-reference-architecture /storefront-reference-architecture; do
            if [ -d "$p" ]; then ln -sfn "$p" ../storefront-reference-architecture && echo "linked $p"; exit 0; fi
          done
          echo "SFRA not found at known paths; locations found:"
          find / -maxdepth 4 -name "storefront-reference-architecture" -type d 2>/dev/null | head -5
          exit 1
      - name: Compile Assets
        run: |
          npm run compile
          npm run compilePPC
          bash .github/scripts/test-compile-error.sh
      - name: Zip the current release artifact
        run: bash .github/scripts/create-zip-artifacts.sh "${{ inputs.tag }}"
      - name: Stage artifacts for upload
        run: cp -r ../artifacts ./release-artifacts-out
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts-out/
          if-no-files-found: error

  publish-github-release:
    needs: create-release
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/
      - name: Publish Release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.zip --clobber
          else
            gh release create "$TAG" --title "Version $TAG" \
              --notes "This release is version $TAG" \
              artifacts/*.zip
          fi
